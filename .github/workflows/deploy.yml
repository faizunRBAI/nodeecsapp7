name: Deploy

on:
  workflow_dispatch:

jobs:
  #  Test 
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint (advisory)
        run: npm run lint || true
        continue-on-error: true

      - name: Run tests
        run: npm test || true

  #  Build 
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build (if applicable)
        run: npm run build || true
        continue-on-error: true

  #  Docker 
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_uri: ${{ steps.set_image_uri.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init (ECR target only)
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Create ECR repository (if not exists)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="image_uri=placeholder" \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Set image tag and URI
        id: set_image_uri
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="${REGISTRY}/${PROJECT_NAME}-app:${IMAGE_TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.set_image_uri.outputs.image_uri }}" .

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.set_image_uri.outputs.image_uri }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.set_image_uri.outputs.image_uri }}"

  #  Deploy 
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="image_uri=${{ needs.docker.outputs.image_uri }}"

      - name: Get ALB DNS name
        id: get_alb
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to stabilise
        run: |
          echo "Waiting 90 seconds for ECS tasks to start and pass health checks..."
          sleep 90

      - name: Smoke test - verify app is reachable
        run: |-
          ALB_URL="http://${{ steps.get_alb.outputs.alb_dns }}/health"
          echo "Hitting: ${ALB_URL}"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${ALB_URL}")
            echo "Attempt ${i}: HTTP ${HTTP_CODE}"
            if [[ "${HTTP_CODE}" =~ ^[23] ]]; then
              echo "Smoke test passed with HTTP ${HTTP_CODE}"
              exit 0
            fi
            echo "Not ready yet, waiting 30 seconds..."
            sleep 30
          done
          echo "Smoke test FAILED after 5 attempts"
          exit 1
